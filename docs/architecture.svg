<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">Car insurance chatbot architecture</title>
<desc id="desc">Streamlit, CLI and FastAPI call ChatService and LangGraph. Local Qwen generates and reviews answers. Hybrid search combines local BM25 over tickets only with Pinecone semantic search using local Nomic query embeddings. Ingestion uploads FAQ and manual vectors, text and metadata to Pinecone; tickets stay local.</desc>
